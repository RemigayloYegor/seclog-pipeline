[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seclog"
version = "0.1.0"
description = "Security log pipeline: sshd/nginx logs -> Kafka -> PostgreSQL + MITRE ATT&CK detections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.3"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
seclog = "seclog.cli:main"

[tool.setuptools]
packages = ["seclog"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
